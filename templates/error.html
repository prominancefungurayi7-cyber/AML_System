{% extends 'base.html' %}
{% block content %}
<section class="card action-card" style="max-width: 540px; margin: 3rem auto; text-align: center; padding: 2.5rem 2rem;">
  <div style="display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 50%; background: rgba(239, 68, 68, 0.1); color: var(--EcoCash-danger); margin-bottom: 1rem;">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="12" y1="8" x2="12" y2="12"></line>
      <line x1="12" y1="16" x2="12.01" y2="16"></line>
    </svg>
  </div>
  <h2 style="margin-top: 0.5rem; margin-bottom: 0.5rem;">Something Went Wrong</h2>
  <p class="muted-line" style="margin-bottom: 1.75rem;">{{ message or 'An unexpected error occurred during processing. Please verify your permissions or try again.' }}</p>
  <div style="display: flex; gap: 0.75rem; justify-content: center;">
    <button type="button" class="btn" onclick="window.history.back()">Go Back</button>
    <a href="{{ url_for('index') }}" class="btn btn-primary">Return Home</a>
  </div>
</section>
{% endblock %}
